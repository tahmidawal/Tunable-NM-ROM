# Iter 2: baseline ModulatedSIREN + strong L2(z) + anchor-at-zero.
decoder_kind: siren

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

siren_num_layers: 5
siren_hidden_dim: 384
omega_0: 30.0
omega: 1.0
modulator_hidden: 192

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500

# Strong L2 on z so the encoder is forced toward small ||z||.
lambda_z: 1.0e-1
lambda_z_warmup_steps: 5000

# Anchor: rel-L2(decode(0, x), u_mean(x)). Weight ~ 1.0 so it competes
# with recon on equal footing.
lambda_anchor: 1.0
lambda_anchor_warmup_steps: 2000
