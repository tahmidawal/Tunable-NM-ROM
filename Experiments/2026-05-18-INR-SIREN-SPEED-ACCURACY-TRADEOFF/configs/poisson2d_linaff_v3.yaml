# linaff v3 — push v2 harder. Bigger Phi, 2x epochs, slightly lower lambda_lap.
# Goal: reach rel-L2 ~ 5e-3 at 200x+ speedup.
decoder_kind: linear_affine_z

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

siren_num_layers: 6                # was 5 (v2)
siren_hidden_dim: 640              # was 512
omega_0: 30.0
omega: 1.0
modulator_hidden: 256
affine_bias_hidden: 384            # was 256

num_epochs: 100000                 # was 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 1000                 # longer warmup for bigger net
log_every: 1000

lambda_z: 1.0e-3
lambda_z_warmup_steps: 5000
lambda_anchor: 0.0
lambda_anchor_warmup_steps: 1
lambda_lap: 5.0e-2                 # was 0.1 — let recon dominate
lambda_lap_warmup_steps: 10000
M_lap: 384                          # more interior points
