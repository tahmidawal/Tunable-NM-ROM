# Modulated SIREN decoder, parametric Poisson-2D.
decoder_kind: siren

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

# Encoder (matches poisson/ paper).
patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

# SIREN decoder.
siren_num_layers: 5
siren_hidden_dim: 256
omega_0: 30.0
omega: 1.0
modulator_hidden: 128

# Training.
num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500
