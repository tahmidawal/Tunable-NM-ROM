# ROM-faithful retraining of XATTN_NARROW (L=3, h=128).
# Identical shape to poisson2d_xattn_narrow.yaml, CG-discrete data.
decoder_kind: xattn

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

d_attn: 64
num_fourier: 16
xattn_num_layers: 3
xattn_hidden_dim: 128
fourier_scale: 4.0

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500
