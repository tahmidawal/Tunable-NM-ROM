# LinearAffine + ROM-aware Laplacian loss.
# Hypothesis: linaff_v1 manifold is great (oracle 3e-3, val 1e-2) but
# the GN-min z != encoder-min z. Adding lap loss aligns the encoder's
# embedding with the ROM-residual minimum.
decoder_kind: linear_affine_z

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

siren_num_layers: 5
siren_hidden_dim: 512
omega_0: 30.0
omega: 1.0
modulator_hidden: 256
affine_bias_hidden: 256

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500

lambda_z: 1.0e-3
lambda_z_warmup_steps: 5000
lambda_anchor: 0.0
lambda_anchor_warmup_steps: 1
lambda_lap: 1.0e-1
lambda_lap_warmup_steps: 5000
M_lap: 256
