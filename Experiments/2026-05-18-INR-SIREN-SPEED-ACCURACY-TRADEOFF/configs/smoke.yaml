num_epochs: 50
batch_size: 4
points_per_sample_train: 64
points_per_sample_val: 64
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 5
log_every: 10
