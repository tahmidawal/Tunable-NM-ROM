[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunable-rom-heat"
version = "0.1.0"
description = "Tunable NM-ROM (ViT encoder + CP decoder) for the parametric Heat equation in 2D and 3D"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tahmid Awal" }]
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.8.0",
    "optax>=0.1.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.5"]

[project.scripts]
heat-generate-data = "scripts.generate_data:main"
heat-train = "scripts.train:main"
heat-run-rom = "scripts.run_rom:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
