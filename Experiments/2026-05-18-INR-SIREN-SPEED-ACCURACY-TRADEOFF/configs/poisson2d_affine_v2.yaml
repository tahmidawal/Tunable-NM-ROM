# Lever D iter 2: affine-in-z decoder with LARGER Phi + SIREN bias.
#
# Diagnosis from v1: 194x speedup but rel-L2=0.20. The manifold doesn't
# contain a good point for most samples. v2 fixes:
#   - Phi: depth 5, width 512 (was 4, 384) -> 1.7x more basis functions
#   - bias(x): 2-hidden SIREN with width 256 (was a single Dense)
#   - same anchor recipe so cold-start still works
decoder_kind: affine_z

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

siren_num_layers: 5
siren_hidden_dim: 512
omega_0: 30.0
omega: 1.0
modulator_hidden: 256
affine_bias_hidden: 256

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500

lambda_z: 1.0e-1
lambda_z_warmup_steps: 5000
lambda_anchor: 1.0
lambda_anchor_warmup_steps: 2000
