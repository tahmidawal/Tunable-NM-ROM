# Poisson-3D N=256 (CG) — ACC variant (val_rel_l2=8.44e-3, speedup=15x).
# REQUIRES data_source=cg (analytical generator produces FOM-inconsistent data at this resolution).
N: 256
spatial_dim: 3
patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 24
rank: 512
hidden_dim: 256
num_epochs: 80000
batch_size: 16
peak_lr: 5.0e-4
weight_decay: 5.0e-4
warmup_frac: 0.05
seed: 42
n_train: 400
n_val: 80
data_source: cg
gn_max_iters: 8
gn_rel_tol: 1.0e-3
n_eq_samples: 200
min_eq_points: 2000
