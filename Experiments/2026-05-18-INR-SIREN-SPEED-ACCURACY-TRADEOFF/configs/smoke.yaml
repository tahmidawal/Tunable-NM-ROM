# Tiny smoke config — used by tests and the smoke SLURM job.
decoder_kind: siren

N: 64
spatial_dim: 2
n_train: 32
n_val: 8
seed: 0

patch_size: 8
embed_dim: 32
num_heads: 2
num_enc_layers: 2
latent_dim: 8

siren_num_layers: 3
siren_hidden_dim: 64
omega_0: 30.0
omega: 1.0
modulator_hidden: 32

d_attn: 32
num_fourier: 8
xattn_num_layers: 2
xattn_hidden_dim: 64
