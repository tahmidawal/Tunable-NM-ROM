# 2000-epoch sanity check: does the full-grid CG training regime actually learn?
decoder_kind: xattn
N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42
patch_size: 16
embed_dim: 64
num_heads: 4
