# Lever D iter 3: bigger latent (32 instead of 16) — affine decoders need
# more linear directions in the basis space than nonlinear ones.
decoder_kind: affine_z

N: 128
spatial_dim: 2
n_train: 700
n_val: 140
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 32

# Moderate Phi (smaller than v2 since latent_dim is bigger).
siren_num_layers: 4
siren_hidden_dim: 384
omega_0: 30.0
omega: 1.0
modulator_hidden: 192
affine_bias_hidden: 192

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500
log_every: 500

lambda_z: 1.0e-1
lambda_z_warmup_steps: 5000
lambda_anchor: 1.0
lambda_anchor_warmup_steps: 2000
