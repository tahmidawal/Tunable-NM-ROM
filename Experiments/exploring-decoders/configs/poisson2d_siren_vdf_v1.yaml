# Iteration 1: variational ViT + default-field SIREN.
N: 128
spatial_dim: 2
seed: 42

patch_size: 16
embed_dim: 64
num_heads: 4
num_enc_layers: 4
latent_dim: 16

siren_num_layers: 5
siren_hidden_dim: 384
omega_0: 30.0
omega: 1.0
modulator_hidden: 192

default_hidden_dim: 128
default_num_layers: 4
default_omega_0: 15.0

num_epochs: 50000
batch_size: 24
points_per_sample_train: 1024
points_per_sample_val: 4096
on_grid_frac_train: 0.5
peak_lr: 1.0e-3
weight_decay: 1.0e-5
warmup_steps: 500

# Variational: gentle KL pressure, warmed in over the first 10% of training.
kl_beta: 1.0e-3
kl_warmup_steps: 5000

log_every: 500
